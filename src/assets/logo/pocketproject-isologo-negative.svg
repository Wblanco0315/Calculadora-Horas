<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 200" fill="none">
  <defs>
    <style>
      .iso-pocket-neg {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        font-size: 110px;
        letter-spacing: -0.04em;
        fill: #FFFFFF;
      }
      .iso-project-neg {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        font-size: 110px;
        letter-spacing: -0.04em;
        fill: #FFFFFF;
        fill-opacity: 0.85;
      }
    </style>
    <mask id="pp-iso-neg-mask-top">
      <rect width="512" height="512" fill="white" />
      <circle cx="230" cy="276" r="16" fill="black" />
    </mask>
    <mask id="pp-iso-neg-mask-bot">
      <rect width="512" height="512" fill="white" />
      <circle cx="282" cy="236" r="16" fill="black" />
    </mask>
  </defs>

  <!-- M.2 Dual-P Squircle Symbol a 14° (Negative) -->
  <g transform="translate(10, 8) scale(0.36)">
    <g transform="rotate(-14 256 256)">
      <!-- Top P (White) -->
      <path mask="url(#pp-iso-neg-mask-top)" fill-rule="evenodd" clip-rule="evenodd"
        d="M 254 48 C 240 48 230 58 230 72 V 344 C 230 358 240 368 256 368 C 272 368 282 358 282 344 V 256 H 312 C 370 256 416 210 416 152 C 416 94 370 48 312 48 H 254 Z M 282 100 H 312 C 340 100 364 124 364 152 C 364 180 340 204 312 204 H 282 V 100 Z"
        fill="#FFFFFF" />
      <!-- Bottom P (White 80% Opacity) -->
      <path mask="url(#pp-iso-neg-mask-bot)" fill-rule="evenodd" clip-rule="evenodd"
        d="M 258 464 C 272 464 282 454 282 440 V 168 C 282 154 272 144 256 144 C 240 144 230 154 230 168 V 256 H 200 C 142 256 96 302 96 360 C 96 418 142 464 200 464 H 258 Z M 230 412 H 200 C 172 412 148 388 148 360 C 148 332 172 308 200 308 H 230 V 412 Z"
        fill="#FFFFFF" fill-opacity="0.80" />
    </g>
  </g>

  <!-- Wordmark Negative -->
  <text x="210" y="138" class="iso-pocket-neg">Pocket<tspan class="iso-project-neg">Project</tspan></text>
</svg>
