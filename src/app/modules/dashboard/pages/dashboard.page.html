<div class="h-screen w-full flex overflow-hidden bg-slate-50 dark:bg-zinc-950 transition-colors duration-200">
  <p-sidebar-layout class="min-h-screen! w-full relative!">
    @if (isMobile() && open()) {
    <p-sidebar-backdrop class="absolute!" />
    }

    <!-- Collapsible PrimeNG Sidebar -->
    <p-sidebar id="preview" [collapsible]="isMobile() ? 'offcanvas' : 'icon'" [overlay]="isMobile()" [(open)]="open">
      <p-sidebar-spacer />
      <p-sidebar-aside>
        <p-sidebar-panel class="bg-white dark:bg-zinc-900 border-r border-slate-200 dark:border-zinc-800">
          <!-- Sidebar Header -->
          <p-sidebar-header class="border-b border-slate-100 dark:border-zinc-800">
            <p-sidebar-menu>
              <p-sidebar-menu-item>
                <button pSidebarMenuButton class="p-1! cursor-pointer" (click)="navigateTo('/dashboard/overview')">
                  <div
                    class="flex size-7 shrink-0 items-center justify-center rounded-xl bg-linear-to-br from-primary-500 to-primary-700 text-white text-xs font-bold shadow-xs">
                    P2
                  </div>
                  <div class="flex flex-col text-left">
                    <span class="font-bold text-sm text-slate-800 dark:text-zinc-100">PocketProject</span>
                    <span class="text-[10px] text-slate-400">Time & Schedule</span>
                  </div>
                </button>
              </p-sidebar-menu-item>
            </p-sidebar-menu>
          </p-sidebar-header>

          <!-- Sidebar Content Navigation -->
          <p-sidebar-content>
            @for (group of navGroups(); track group.label) {
            <p-sidebar-group>
              <p-sidebar-group-label>{{ group.label }}</p-sidebar-group-label>
              <p-sidebar-group-content>
                <p-sidebar-menu>
                  @for (item of group.items; track item.label) {
                  <p-sidebar-menu-item>
                    <button pSidebarMenuButton [isActive]="!!item.isActive" [class.bg-primary-50]="item.isActive"
                      [class.text-primary-700]="item.isActive" [class.dark:bg-primary-950/60]="item.isActive"
                      [class.dark:text-primary-300]="item.isActive" [class.font-semibold]="item.isActive"
                      class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl transition-all cursor-pointer hover:bg-slate-100 dark:hover:bg-zinc-800"
                      (click)="item.action ? item.action() : null">
                      <ng-icon [name]="item.icon" size="1.1rem" class="shrink-0"
                        [class.text-primary-600]="item.isActive" [class.dark:text-primary-400]="item.isActive" />
                      <span class="text-xs sm:text-sm">{{ item.label }}</span>
                    </button>
                    @if (item.badge) {
                    <p-sidebar-menu-badge>{{ item.badge }}</p-sidebar-menu-badge>
                    }
                  </p-sidebar-menu-item>
                  }
                </p-sidebar-menu>
              </p-sidebar-group-content>
            </p-sidebar-group>
            }
          </p-sidebar-content>

          <!-- Sidebar Footer with User Profile (Direct link to Settings > User tab) -->
          <p-sidebar-footer class="border-t border-slate-100 dark:border-zinc-800">
            <p-sidebar-menu>
              <p-sidebar-menu-item>
                <button pSidebarMenuButton class="p-1! cursor-pointer" (click)="openUserSettings()"
                  [title]="'settings.tabUser' | translate">
                  <p-avatar [label]="userInitials()" shape="circle"
                    class="size-7 shrink-0 text-xs bg-primary-100 text-primary-700 dark:bg-primary-950 dark:text-primary-300 font-bold" />
                  <div class="flex flex-col text-left min-w-0">
                    <span class="text-xs font-semibold text-slate-800 dark:text-zinc-200 truncate">
                      {{ userName() }}
                    </span>
                    <span class="text-[10px] text-slate-400 capitalize">
                      {{ config().primary_color }} · {{ config().theme_mode }}
                    </span>
                  </div>
                </button>
              </p-sidebar-menu-item>
            </p-sidebar-menu>
          </p-sidebar-footer>
          <button pSidebarRail></button>
        </p-sidebar-panel>
      </p-sidebar-aside>
    </p-sidebar>

    <!-- Main Shell Area -->
    <p-sidebar-main class="flex-1 flex flex-col h-screen">
      <!-- Sticky Top Header with Breadcrumb and Action Buttons -->
      <header
        class="flex h-16 sm:sticky sm:top-0 sm:z-50 sm:backdrop-blur-sm items-center justify-between border-b border-slate-200 dark:border-zinc-800 px-4 py-1.5 sm:px-6 bg-white/80 dark:bg-zinc-900/80">
        <!-- Left: Sidebar Toggle + Breadcrumb -->
        <div class="flex items-center gap-2 sm:gap-3 min-w-0">
          <button pButton pSidebarTrigger target="preview" iconOnly rounded severity="secondary">
            <ng-icon name="tablerLayoutSidebar" size="1.25rem" />
          </button>

          <!-- PrimeNG Breadcrumb Component -->
          <p-breadcrumb [model]="breadcrumbItems()" [home]="breadcrumbHome()"
            styleClass="bg-transparent! border-none! p-0! text-xs sm:text-sm">
            <ng-template #item let-item>
              @if (item.icon) {
              <a [routerLink]="item.routerLink"
                class="flex items-center text-slate-500 hover:text-primary-600 dark:text-zinc-400 dark:hover:text-primary-400 transition-colors">
                <ng-icon [name]="item.icon" size="1.1rem" />
              </a>
              } @else if (item.routerLink) {
              <a [routerLink]="item.routerLink"
                class="font-medium text-slate-500 hover:text-primary-600 dark:text-zinc-400 dark:hover:text-primary-400 transition-colors">
                {{ item.label }}
              </a>
              } @else {
              <span class="font-bold text-slate-900 dark:text-zinc-100">
                {{ item.label }}
              </span>
              }
            </ng-template>

            <ng-template #separator>
              <ng-icon name="tablerChevronRight" size="0.875rem" class="text-slate-400 dark:text-zinc-500 shrink-0" />
            </ng-template>
          </p-breadcrumb>
        </div>

        <!-- Right: Actions -->
        <div class="flex items-center gap-2 shrink-0 xs:hidden">
          <!-- Refresh with Skeleton reload -->
          <button pButton (click)="reloadWithSkeleton()" iconOnly rounded severity="secondary"
            [title]="'dashboard.refresh' | translate">
            <ng-icon name="tablerRefresh" size="1.15rem" [class.animate-spin]="isLoading()" />
          </button>

          <!-- Quick Theme Toggle -->
          <button pButton (click)="toggleTheme()" iconOnly rounded severity="secondary"
            [title]="'dashboard.themeMode' | translate: { mode: config().theme_mode }">
            <ng-icon [name]="themeService.isDark() ? 'tablerSun' : 'tablerMoon'" size="1.15rem" />
          </button>

          <!-- Compact Mode Button -->
          <button pButton (click)="windowService.setCompactMode()" iconOnly rounded severity="secondary"
            [title]="'dashboard.compactMode' | translate">
            <ng-icon name="tablerAppWindow" size="1.15rem" />
          </button>

          <!-- Settings Button -->
          <button pButton (click)="navigateTo('/dashboard/settings')" variant="outlined" severity="secondary"
            class="flex items-center">
            <ng-icon name="tablerSettings" size="1rem" class="mr-1.5" />
            <span>{{ 'dashboard.settings' | translate }}</span>
          </button>
        </div>
      </header>

      <!-- Main Content Container for Child Views -->
      <main class="flex-1 min-h-0 overflow-y-auto p-4 sm:p-6 lg:p-8 flex flex-col">
        <router-outlet />
      </main>
    </p-sidebar-main>
  </p-sidebar-layout>
</div>
