<div class="flex flex-col gap-4 rounded-3xl border border-slate-200 bg-white p-5 shadow-xs sm:p-6 dark:border-zinc-800 dark:bg-zinc-900">
  <div class="flex items-center justify-between gap-3">
    <h3 class="flex items-center gap-2 text-sm font-bold text-slate-900 dark:text-zinc-100">
      <ng-icon name="tablerCalendar" size="1.15rem" class="text-primary-500" />
      {{ 'dashboard.weeklySchedule' | translate }}
    </h3>
    <div class="flex items-center gap-2">
      <span class="hidden font-mono text-xs text-slate-500 sm:inline dark:text-zinc-400">
        {{ 'overview.weeklyGoal' | translate: { hours: weeklyTarget() } }}
      </span>
      <button pButton (click)="openScheduleModal()" variant="text" size="small">
        {{ 'dashboard.editScheduleBtn' | translate }}
      </button>
    </div>
  </div>

  <div class="grid grid-cols-4 gap-2 sm:grid-cols-7">
    @for (day of days(); track day.day) {
      <div
        class="flex flex-col gap-1.5 rounded-xl border px-3 py-2.5"
        [class]="
          day.isToday
            ? 'border-primary-500 bg-primary-50/50 dark:border-primary-500 dark:bg-primary-950/30'
            : 'border-slate-200 dark:border-zinc-800'
        "
        [class.opacity-50]="!day.enabled"
        [title]="day.enabled ? day.hours : ''"
      >
        <span class="text-xs font-semibold text-slate-700 dark:text-zinc-200">{{ day.label | translate }}</span>
        @if (day.enabled) {
          <span class="font-mono text-xs text-slate-900 dark:text-zinc-100">
            {{ day.logged }}<span class="text-slate-400 dark:text-zinc-500"> / {{ day.target }}</span>
          </span>
          <div class="h-1 overflow-hidden rounded-full bg-slate-200/80 dark:bg-zinc-700/60">
            <div class="h-full rounded-full bg-primary-500" [style.width.%]="day.progress"></div>
          </div>
        } @else {
          <span class="text-xs text-slate-400 dark:text-zinc-500">{{ 'overview.rest' | translate }}</span>
        }
      </div>
    }
  </div>
</div>

<app-schedule-modal [(visible)]="isScheduleModalVisible" />
