@defer (when isLoaded(); prefetch on idle) {
<div class="space-y-6 animate-fadeIn grid grid-cols-1 gap-6 lg:grid-cols-2 lg:gap-3">
  <app-overview-banner class="lg:col-span-2" />
  <app-overview-summary class="lg:col-span-2" />
  <app-overview-schedule class="lg:col-span-2" />
</div>
} @placeholder (minimum 500ms) {
<!-- SKELETON LOADING STATE -->
<div class="space-y-6 animate-pulse">
  <!-- Banner Skeleton -->
  <p-skeleton width="100%" height="86px" borderRadius="1.5rem" />

  <!-- 3 Metric Cards Skeletons -->
  <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
    @for (i of [1, 2, 3]; track i) {
    <div class="p-5 rounded-2xl bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 space-y-3">
      <div class="flex items-center justify-between">
        <p-skeleton shape="circle" size="2.25rem" />
        <p-skeleton width="4rem" height="1.25rem" borderRadius="0.5rem" />
      </div>
      <p-skeleton width="50%" height="0.875rem" />
      <p-skeleton width="70%" height="1.5rem" />
      <p-skeleton width="90%" height="0.75rem" />
    </div>
    }
  </div>

  <!-- Weekly Calendar Skeleton -->
  <div class="p-6 rounded-3xl bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 space-y-4">
    <div class="flex items-center justify-between border-b border-slate-100 dark:border-zinc-800 pb-3">
      <p-skeleton width="12rem" height="1.25rem" />
      <p-skeleton width="6rem" height="1.5rem" />
    </div>
    <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-3">
      @for (i of [1, 2, 3, 4, 5, 6, 7]; track i) {
      <p-skeleton width="100%" height="6.5rem" borderRadius="1rem" />
      }
    </div>
  </div>
</div>
}
