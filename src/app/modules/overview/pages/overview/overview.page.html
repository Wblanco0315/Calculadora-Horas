@defer (when isLoaded(); prefetch on idle) {
<div class="flex flex-col gap-6 animate-fadeIn">
  <app-overview-banner />
  <app-overview-schedule />
  <app-overview-summary />
  <div class="grid grid-cols-1 gap-6 lg:grid-cols-3">
    <app-overview-time-chart class="lg:col-span-2" />
    <app-overview-project-ranking />
  </div>
</div>
} @placeholder (minimum 500ms) {
<!-- SKELETON LOADING STATE -->
<div class="flex flex-col gap-6 animate-pulse">
  <p-skeleton width="100%" height="86px" borderRadius="1.5rem" />

  <div class="space-y-4 rounded-3xl border border-slate-200 bg-white p-6 dark:border-zinc-800 dark:bg-zinc-900">
    <div class="flex items-center justify-between">
      <p-skeleton width="10rem" height="1.25rem" />
      <p-skeleton width="6rem" height="1.5rem" />
    </div>
    <div class="grid grid-cols-4 gap-2 sm:grid-cols-7">
      @for (i of [1, 2, 3, 4, 5, 6, 7]; track i) {
      <p-skeleton width="100%" height="4.25rem" borderRadius="0.75rem" />
      }
    </div>
  </div>

  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-4">
    @for (i of [1, 2, 3, 4]; track i) {
    <div class="space-y-3 rounded-2xl border border-slate-200 bg-white p-5 dark:border-zinc-800 dark:bg-zinc-900">
      <p-skeleton width="50%" height="0.875rem" />
      <p-skeleton width="70%" height="1.5rem" />
      <p-skeleton width="100%" height="0.375rem" />
      <p-skeleton width="80%" height="0.75rem" />
    </div>
    }
  </div>

  <div class="grid grid-cols-1 gap-6 lg:grid-cols-3">
    <div class="space-y-4 rounded-3xl border border-slate-200 bg-white p-6 lg:col-span-2 dark:border-zinc-800 dark:bg-zinc-900">
      <p-skeleton width="10rem" height="1.25rem" />
      <p-skeleton width="100%" height="18rem" borderRadius="1rem" />
    </div>
    <div class="space-y-4 rounded-3xl border border-slate-200 bg-white p-6 dark:border-zinc-800 dark:bg-zinc-900">
      <p-skeleton width="12rem" height="1.25rem" />
      @for (i of [1, 2, 3, 4, 5]; track i) {
      <p-skeleton width="100%" height="2rem" />
      }
    </div>
  </div>
</div>
}
