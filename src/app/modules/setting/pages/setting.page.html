<div class="animate-fadeIn flex flex-1 min-h-0 flex-col w-full">
  <!-- Page Header -->
  <div class="pb-4 shrink-0 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
    <div>
      <h1
        class="text-xl sm:text-2xl font-bold tracking-tight text-slate-900 dark:text-zinc-100 flex items-center gap-2">
        <ng-icon name="tablerSettings" size="1.35rem" class="text-primary-600 dark:text-primary-400" />
        <span>{{ 'settings.title' | translate }}</span>
      </h1>
    </div>
  </div>

  <!-- PrimeNG Tabs Component -->
  <p-tabs
    [value]="activeTab"
    (valueChange)="onTabChange($event)"
    class="flex flex-1 min-h-0 flex-col border rounded-xl border-slate-200 dark:border-zinc-800 bg-white/40 dark:bg-zinc-900/40 overflow-hidden shadow-xs"
  >
    <!-- Tab Navigation Bar: Guaranteed Visible & Pinned at Top (Never Shrinks) -->
    <p-tablist class="shrink-0 sticky top-0 z-10 bg-white dark:bg-zinc-900 border-b border-slate-200 dark:border-zinc-800">
      <!-- User Tab Header -->
      <p-tab value="user" class="flex items-center gap-2 cursor-pointer py-2.5 px-4">
        <ng-icon name="tablerUser" size="1.15rem" />
        <span class="font-semibold text-xs sm:text-sm">{{ 'settings.tabUser' | translate }}</span>
      </p-tab>

      <!-- System Tab Header -->
      <p-tab value="system" class="flex items-center gap-2 cursor-pointer py-2.5 px-4">
        <ng-icon name="tablerSettings" size="1.15rem" />
        <span class="font-semibold text-xs sm:text-sm">{{ 'settings.tabSystem' | translate }}</span>
      </p-tab>
    </p-tablist>

    <!-- Scrollable Tab Panels Container -->
    <p-tabpanels class="flex-1 min-h-0 overflow-y-auto p-4 sm:p-6 w-full">
      <!-- USER TAB PANEL -->
      <p-tabpanel value="user">
        <app-user-section />
      </p-tabpanel>

      <!-- SYSTEM TAB PANEL -->
      <p-tabpanel value="system">
        <app-system-section />
      </p-tabpanel>
    </p-tabpanels>

  </p-tabs>
</div>
