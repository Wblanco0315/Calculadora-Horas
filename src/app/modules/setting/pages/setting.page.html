<div class="space-y-6 animate-fadeIn">
  <!-- Page Header -->
  <div
    class="border-b border-slate-200 dark:border-zinc-800 pb-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
    <div>
      <h1
        class="text-xl sm:text-2xl font-bold tracking-tight text-slate-900 dark:text-zinc-100 flex items-center gap-2.5">
        <div
          class="w-8 h-8 rounded-xl bg-primary-100 dark:bg-primary-950 text-primary-600 dark:text-primary-400 flex items-center justify-center shrink-0">
          <ng-icon name="tablerSettings" size="1.25rem" />
        </div>
        <span>{{ 'settings.title' | translate }}</span>
      </h1>
      <p class="text-xs sm:text-sm text-slate-500 dark:text-zinc-400 mt-1">
        {{ 'settings.subtitle' | translate }}
      </p>
    </div>
  </div>

  <!-- PrimeNG Tabs Component -->
  <p-tabs [value]="activeTab" (valueChange)="onTabChange($event)" styleClass="w-full">
    <p-tablist>
      <!-- User Tab Header -->
      <p-tab value="user" class="flex items-center gap-2 cursor-pointer py-2.5 px-4">
        <ng-icon name="tablerUser" size="1.15rem" />
        <span class="font-semibold text-xs sm:text-sm">{{ 'settings.tabUser' | translate }}</span>
      </p-tab>

      <!-- System Tab Header -->
      <p-tab value="system" class="flex items-center gap-2 cursor-pointer py-2.5 px-4">
        <ng-icon name="tablerSettings" size="1.15rem" />
        <span class="font-semibold text-xs sm:text-sm">{{ 'settings.tabSystem' | translate }}</span>
      </p-tab>
    </p-tablist>

    <p-tabpanels class="pt-6 flex-col overflow-y-auto w-full h-full">
      <!-- USER TAB PANEL -->
      <p-tabpanel value="user">
        <app-user-section />
      </p-tabpanel>

      <!-- SYSTEM TAB PANEL -->
      <p-tabpanel value="system">
        <app-system-section />
      </p-tabpanel>
    </p-tabpanels>
  </p-tabs>
</div>
