<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <title>PocketProject</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
    rel="stylesheet">

  <!-- Startup loader: visible before Angular boots; removed by hideAppLoader() (core/utils/app-loader.util.ts). -->
  <style>
    #app-loader {
      position: fixed;
      inset: 0;
      z-index: 10001;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      background: #f8fafc;
      transition: opacity 200ms ease-out;
      --app-loader-primary: #5E4DA2;
      --app-loader-ink: #0f172a;
      --app-loader-track: #e2e8f0;
    }
    html.dark #app-loader {
      background: #09090b;
      --app-loader-ink: #ffffff;
      --app-loader-track: #27272a;
    }
    #app-loader.app-loader--hidden {
      opacity: 0;
      pointer-events: none;
    }
    #app-loader svg {
      width: 64px;
      height: 64px;
      animation: app-loader-pulse 1.4s ease-in-out infinite;
    }
    #app-loader .app-loader-bar {
      position: relative;
      width: 120px;
      height: 3px;
      overflow: hidden;
      border-radius: 9999px;
      background: var(--app-loader-track);
    }
    #app-loader .app-loader-bar::after {
      content: '';
      position: absolute;
      inset: 0;
      width: 40%;
      border-radius: 9999px;
      background: var(--app-loader-primary);
      animation: app-loader-slide 1.1s ease-in-out infinite;
    }
    @keyframes app-loader-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.94); opacity: 0.85; }
    }
    @keyframes app-loader-slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #app-loader svg, #app-loader .app-loader-bar::after { animation: none; }
    }
  </style>
  <script>
    // Apply the saved theme and accent before the first paint (same keys as ThemeService).
    (function () {
      try {
        var presets = { violet: '#5E4DA2', indigo: '#6366F1', blue: '#2563EB', emerald: '#059669', amber: '#D97706', rose: '#E11D48' };
        var mode = localStorage.getItem('pocketproject_theme') || 'system';
        var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
        var color = localStorage.getItem('pocketproject_color');
        var hex = color && (presets[color] || (/^#?[0-9a-fA-F]{6}$/.test(color) ? (color[0] === '#' ? color : '#' + color) : null));
        if (hex) document.documentElement.style.setProperty('--app-loader-primary', hex);
      } catch (e) { /* storage unavailable: defaults */ }
    })();
  </script>
</head>

<body class="font-sans antialiased selection:bg-primary-500 selection:text-white">
  <div id="app-loader" role="status" aria-label="Cargando PocketProject">
    <svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <mask id="app-loader-mask-top">
          <rect width="512" height="512" fill="white" />
          <circle cx="230" cy="276" r="16" fill="black" />
        </mask>
        <mask id="app-loader-mask-bot">
          <rect width="512" height="512" fill="white" />
          <circle cx="282" cy="236" r="16" fill="black" />
        </mask>
      </defs>
      <g transform="rotate(-14 256 256)">
        <path mask="url(#app-loader-mask-top)" fill-rule="evenodd" clip-rule="evenodd" style="fill: var(--app-loader-primary)"
          d="M 254 48 C 240 48 230 58 230 72 V 344 C 230 358 240 368 256 368 C 272 368 282 358 282 344 V 256 H 312 C 370 256 416 210 416 152 C 416 94 370 48 312 48 H 254 Z M 282 100 H 312 C 340 100 364 124 364 152 C 364 180 340 204 312 204 H 282 V 100 Z" />
        <path mask="url(#app-loader-mask-bot)" fill-rule="evenodd" clip-rule="evenodd" style="fill: var(--app-loader-ink)"
          d="M 258 464 C 272 464 282 454 282 440 V 168 C 282 154 272 144 256 144 C 240 144 230 154 230 168 V 256 H 200 C 142 256 96 302 96 360 C 96 418 142 464 200 464 H 258 Z M 230 412 H 200 C 172 412 148 388 148 360 C 148 332 172 308 200 308 H 230 V 412 Z" />
      </g>
    </svg>
    <div class="app-loader-bar"></div>
  </div>
  <app-root></app-root>
</body>

</html>
